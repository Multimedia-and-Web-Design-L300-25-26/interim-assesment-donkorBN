[build]
  command = "npm install --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "node_modules/**, frontend/node_modules/**, frontend/dist/**"
  SECRETS_SCAN_OMIT_KEYS = "PORT, NODE_ENV"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
